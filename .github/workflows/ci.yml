name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core library
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libeigen3-dev \
            libgtest-dev \
            libopenmpi-dev \
            libpcl-dev \
            ninja-build \
            pkg-config
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_ROS_NODE=OFF -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  ros2:
    name: ros2 humble
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libeigen3-dev \
            libopenmpi-dev \
            libpcl-dev \
            python3-colcon-common-extensions \
            ros-humble-ament-cmake \
            ros-humble-pcl-conversions \
            ros-humble-rclcpp \
            ros-humble-sensor-msgs \
            ros-humble-visualization-msgs
      - name: Build
        shell: bash
        run: |
          set -exo pipefail
          # Humble's setup.bash reads an optional trace variable.
          set +u
          source /opt/ros/humble/setup.bash
          set -u
          colcon build \
            --packages-select lidar_shape_classifier \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
